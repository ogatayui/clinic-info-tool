<title>院情報確認ツール</title>
<style>

</style>

<body>
  <div class="box">
    <h1>📦 院情報確認ツールはゲンテンに引っ越しました</h1>
    <p>院情報の確認は、ゲンテン左のメニュー<br><span class="em">「院情報確認」</span>から開いてください。</p>
    <p>これまでの入力・進捗はゲンテンに引き継いでいます。</p>
  </div>
